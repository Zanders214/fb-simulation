# SonarQube Cloud configuration (keys from the project's onboarding page).
sonar.projectKey=fb-simulator_fb-simulator
sonar.organization=fb-simulator
sonar.projectName=FB Simulation

sonar.sources=src,app
sonar.sourceEncoding=UTF-8

# Coverage produced by `jest --coverage`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Generated / config / test-helper files are not analyzed.
sonar.exclusions=node_modules/**,dist/**,.expo/**,coverage/**,**/__tests__/**,scripts/**,*.config.js,babel.config.js

# The pure engine is unit-tested; UI, store glue and native-bound code are
# verified by running the app. Analyze everything for quality, but base the
# coverage percentage on the engine only.
sonar.coverage.exclusions=app/**,src/components/**,src/ui/**,src/theme.ts,src/store/**,src/persistence/**

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Cancel an in-progress run if the same ref is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, type-check, test & analyze
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so SonarCloud can compute accurate blame / new-code.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (with coverage)
        run: npm test -- --coverage --ci

      # Runs only once SONAR_TOKEN is set in the repo secrets (see README).
      # sonar.qualitygate.wait makes this step (and the build) fail if the
      # SonarCloud quality gate fails.
      - name: SonarQube Cloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # Host-contract analog: lint/typecheck prove the code parses and type-checks,
  # but only a real bundle proves every import resolves and nothing throws at
  # module-load. A web export is fully headless (no simulator/browser) and is
  # already exercised by `npm run analyze`, so it's the high-signal, low-cost
  # check. Runs in parallel with the build job; needs no secrets.
  build-web:
    name: Expo web export smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo web export (bundles without import/runtime errors)
        run: npx expo export --platform web --output-dir dist
        timeout-minutes: 10

      - name: Assert a bundle was produced
        run: test -d dist && test -n "$(ls -A dist)"
